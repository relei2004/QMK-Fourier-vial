name: Build Vial firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      - name: Checkout vial-qmk
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          path: vial-qmk
          submodules: recursive

      - name: Copy keyboard into vial-qmk
        run: |
          mkdir -p vial-qmk/keyboards/fourier
          cp -r kp2040/* vial-qmk/keyboards/fourier/

      - name: Install dependencies
        run: |
          python3 -m pip install --user qmk
          python3 -m qmk setup -y -H vial-qmk

      - name: Build firmware
        working-directory: vial-qmk
        run: |
          qmk compile -kb fourier -km vial

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fourier-vial-firmware
          path: |
            vial-qmk/*.uf2
            vial-qmk/*.hex
            vial-qmk/*.bin
